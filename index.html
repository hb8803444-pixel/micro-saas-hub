<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online JSON Formatter & Validator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        textarea { width: 100%; height: 200px; padding: 10px; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        .buttons { margin: 15px 0; text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 5px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: #d9534f; margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>JSON Formatter & Beautifier</h2>
    <textarea id="jsonInput" placeholder="Paste your messy JSON code here..."></textarea>
    
    <div class="buttons">
        <button onclick="formatJSON()">Format / Beautify</button>
        <button onclick="minifyJSON()">Minify</button>
        <button onclick="clearText()">Clear</button>
    </div>

    <div id="errorMsg" class="error"></div>
</div>

<script>
    function formatJSON() {
        let input = document.getElementById('jsonInput').value;
        let errorDiv = document.getElementById('errorMsg');
        try {
            if(!input.trim()) {
                errorDiv.innerText = "Please enter some JSON data!";
                return;
            }
            let parsed = JSON.parse(input);
            document.getElementById('jsonInput').value = JSON.stringify(parsed, null, 4);
            errorDiv.innerText = "";
        } catch (e) {
            errorDiv.innerText = "Invalid JSON: " + e.message;
        }
    }

    function minifyJSON() {
        let input = document.getElementById('jsonInput').value;
        let errorDiv = document.getElementById('errorMsg');
        try {
            if(!input.trim()) {
                errorDiv.innerText = "Please enter some JSON data!";
                return;
            }
            let parsed = JSON.parse(input);
            document.getElementById('jsonInput').value = JSON.stringify(parsed);
            errorDiv.innerText = "";
        } catch (e) {
            errorDiv.innerText = "Invalid JSON: " + e.message;
        }
    }

    function clearText() {
        document.getElementById('jsonInput').value = "";
        document.getElementById('errorMsg').innerText = "";
    }
</script>

</body>
</html>
